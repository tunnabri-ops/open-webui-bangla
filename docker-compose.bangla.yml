services:
  open-webui:
    # Image and volume path taken from the upstream README's docker run command.
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-bangla
    ports:
      - "3000:8080"
    environment:
      # Local Ollama on the same machine (run Ollama first, see ollama-bangla).
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
